{% extends 'base.html' %}
{% block title %}Change password | ShopEase{% endblock %}
{% block content %}<section class="auth-simple"><span class="eyebrow">ACCOUNT SECURITY</span><h1>A fresh <em>password.</em></h1><form method="post" class="stack-form">{% csrf_token %}{% for field in form %}<div class="field-wrap"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<small class="field-error">{{ field.errors|join:', ' }}</small>{% endif %}</div>{% endfor %}<button class="button button-dark" type="submit">Update password</button></form><a class="back-to-shop" href="{% url 'profile' %}">← Back to account</a></section>{% endblock %}
