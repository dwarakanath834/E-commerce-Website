{% extends 'base.html' %}
{% block title %}Reset password | ShopEase{% endblock %}
{% block content %}<section class="auth-simple"><span class="eyebrow">NO WORRIES</span><h1>Let's get you <em>back in.</em></h1><p class="auth-lead">Enter the email address on your account and we’ll send you a reset link.</p><form method="post" class="stack-form">{% csrf_token %}<label for="id_email">Email address</label><input id="id_email" type="email" name="email" autocomplete="email" required><button class="button button-dark" type="submit">Send reset link <span>↗</span></button></form></section>{% endblock %}
